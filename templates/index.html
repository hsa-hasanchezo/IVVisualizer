<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PV Solar Optimizer with IV tracing</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Base de estilos CSS adaptativa */
        .grid-2 { display: flex; gap: 10px; width: 100%; }
        .grid-2 .btn { flex: 1; }
        
        /* Fila de 3 botones en horizontal para las acciones de curvas */
        .grid-3 { display: flex; gap: 10px; width: 100%; }
        .grid-3 .btn { flex: 1; font-size: 13px; padding: 10px 5px; font-weight: bold; }
        
        .control-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left; }
        .control-group label { color: #fff; font-size: 14px; font-weight: bold; }
        .control-group select, .control-group input[type="range"] { width: 100%; padding: 10px; border-radius: 20px; background: #2c2c35; color: white; border: 1px solid #444; font-size: 14px; }
        
        /* Contenedor de indicadores: Por defecto usa 4 columnas en PC */
        .readouts-4 { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            margin-top: 10px; 
            width: 100%; 
        }
        .readout.mini { padding: 10px 5px; font-size: 13px; text-align: center; border-radius: 10px; }
        .readout.mini .value { font-size: 16px; font-weight: bold; margin-top: 4px; }

        /* Contenedor de las gráficas: Proporciones más altas manteniendo la anchura completa */
        .canvas-container { 
            height: 400px; /* Incrementado a 400px para PC */
            margin-bottom: 25px; 
            width: 100%; 
        }

        /* --- RESPONSIVE DESIGN (Media Queries) --- */

        /* Tablets y pantallas medianas (Menos de 768px) */
        @media (max-width: 768px) {
            .readouts-4 {
                grid-template-columns: repeat(2, 1fr); /* Pasa a 2 columnas y 2 filas */
                gap: 8px;
            }
            .readout.mini { padding: 8px 4px; }
            .readout.mini .label { font-size: 12px; }
            .readout.mini .value { font-size: 15px; }
        }

        /* Teléfonos móviles (Menos de 480px) */
        @media (max-width: 480px) {
            .grid-2 { 
                flex-direction: column; /* Botón conectar y config se apilan uno sobre otro */
                gap: 8px; 
            }
            .grid-3 { gap: 5px; }
            .grid-3 .btn { font-size: 11px; padding: 8px 2px; }
            
            .readouts-4 {
                grid-template-columns: repeat(2, 1fr); /* Mantiene 2x2 pero ajusta textos */
            }
            .readout.mini .label { font-size: 11px; }
            .readout.mini .value { font-size: 14px; }
            
            /* Ajuste de altura responsivo más alto para pantallas móviles */
            .canvas-container { height: 320px; } 
            
            h2 { font-size: 1.2rem; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>PV Solar Optimizer with IV tracing</h2>
        
        <div class="controls">
            <div class="grid-2">
                <button id="botonConectar" class="btn">Connect Bluetooth</button>
                <button id="botonConfig" class="btn" style="background-color: #555;">Configuration</button>
            </div>

            <div class="control-group" style="margin-top: 10px;">
                <label for="selectorModo">Control mode:</label>
                <select id="selectorModo">
                    <option value="MODO1">MPPT control mode</option>
                    <option value="MODO2">Input voltage control mode</option>
                    <option value="MODO3" selected>Duty cycle control mode</option>
                </select>
            </div>

            <div class="control-group">
                <label id="labelSlider" for="barraFijarVal">Setpoint (Duty Cycle): <span id="valorSliderText">0</span>%</label>
                <input type="range" id="barraFijarVal" min="0" max="100" value="0" disabled>
            </div>

            <div class="grid-3" style="width: 100%; margin-top: 10px;">
                <button id="botonBarrido" class="btn" style="background-color: #ffca28; color: #1e1e24;">Get I-V Curve</button>
                <button id="botonFreeze" class="btn" style="background-color: #78909c;">Freeze I-V Curve</button>
                <button id="botonClear" class="btn" style="background-color: #e53935;">Clear I-V Curve</button>
            </div>

            <div class="readouts-4">
                <div class="readout mini">
                    <div class="label">Input Voltage</div>
                    <div class="value"><span id="dispVin">-</span> V</div>
                </div>
