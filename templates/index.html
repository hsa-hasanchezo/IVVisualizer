<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PV Solar Optimizer with IV tracing</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Base de estilos CSS adaptativa */
        .grid-2 { display: flex; gap: 10px; width: 100%; }
        .grid-2 .btn { flex: 1; }
        
        .control-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left; }
        .control-group label { color: #fff; font-size: 14px; font-weight: bold; }
        .control-group select, .control-group input[type="range"] { width: 100%; padding: 10px; border-radius: 20px; background: #2c2c35; color: white; border: 1px solid #444; font-size: 14px; }
        
        /* Contenedor de indicadores: Por defecto usa 4 columnas en PC */
        .readouts-4 { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            margin-top: 10px; 
            width: 100%; 
        }
        .readout.mini { padding: 10px 5px; font-size: 13px; text-align: center; border-radius: 10px; }
        .readout.mini .value { font-size: 16px; font-weight: bold; margin-top: 4px; }

        /* --- RESPONSIVE DESIGN (Media Queries) --- */

        /* Tablets y pantallas medianas (Menos de 768px) */
        @media (max-width: 768px) {
            .readouts-4 {
                grid-template-columns: repeat(2, 1fr); /* Pasa a 2 columnas y 2 filas */
                gap: 8px;
            }
            .readout.mini { padding: 8px 4px; }
            .readout.mini .label { font-size: 12px; }
            .readout.mini .value { font-size: 15px; }
        }

        /* Teléfonos móviles (Menos de 480px) */
        @media (max-width: 480px) {
            .grid-2 { 
                flex-direction: column; /* Botón conectar y config se apilan uno sobre otro */
                gap: 8px; 
            }
            .readouts-4 {
                grid-template-columns: repeat(2, 1fr); /* Mantiene 2x2 pero ajusta textos */
            }
            .readout.mini .label { font-size: 11px; }
            .readout.mini .value { font-size: 14px; }
            
            /* Evita que el contenedor de la gráfica colapse en pantallas muy pequeñas */
            .canvas-container { height: 260px; } 
            
            h2 { font-size: 1.2rem; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>PV Solar Optimizer with IV tracing</h2>
        
        <div class="controls">
            <div class="grid-2">
                <button id="botonConectar" class="btn">Connect Bluetooth</button>
                <button id="botonConfig" class="btn" style="background-color: #555;">Configuration</button>
            </div>

            <div class="control-group" style="margin-top: 10px;">
                <label for="selectorModo">Control mode:</label>
                <select id="selectorModo">
                    <option value="MODO1">MPPT control mode</option>
                    <option value="MODO2">Input voltage control mode</option>
                    <option value="MODO3" selected>Dyty cycle control mode</option>
                </select>
            </div>

            <div class="control-group">
                <label id="labelSlider" for="barraFijarVal">Setpoint value: <span id="valorSliderText">50</span>%</label>
                <input type="range" id="barraFijarVal" min="0" max="100" value="50" disabled>
            </div>

            <div style="width: 100%;">
                <button id="IV trace" class="btn" style="width: 100%;" disabled>IV trace</button>
            </div>

            <div class="readouts-4">
                <div class="readout mini">
                    <div class="label">Input Voltage</div>
                    <div class="value"><span id="dispVin">-</span> V</div>
                </div>
                <div class="readout mini">
                    <div class="label">Input Current</div>
                    <div class="value"><span id="dispIin">-</span> A</div>
                </div>
                <div class="readout mini">
                    <div class="label">Output Voltage</div>
                    <div class="value"><span id="dispVout">-</span> V</div>
                </div>
                <div class="readout mini">
                    <div class="label">Output Current</div>
                    <div class="value"><span id="dispIout">-</span> A</div>
                </div>
            </div>

            <div class="readouts-4">
                <div class="readout mini">
                    <div class="label">Input Power</div>
                    <div class="value"><span id="dispPin">-</span> W</div>
                </div>
                <div class="readout mini">
                    <div class="label">Output Power</div>
                    <div class="value"><span id="dispPout">-</span> W</div>
                </div>
                <div class="readout mini">
                    <div class="label">Efficiency</div>
                    <div class="value"><span id="dispEff">-</span> %</div>
                </div>
                <div class="readout mini">
                    <div class="label">Duty Cycle</div>
                    <div class="value"><span id="dispDuty">-</span> %</div>
                </div>
            </div>
        </div>
        
        <div class="canvas-container" style="margin-top:20px;">
            <canvas id="graficoIV"></canvas>
        </div>

        <div class="chart-actions" style="margin-top:10px;">
            <button id="botonDescargarCSV" class="btn btn-csv">Download CSV</button>
        </div>
    </div>

    <script src="../static/js/app.js"></script>

    <div id="modalConfig" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Calibration Constants</h3>
        <p style="color: #bbb; font-size: 13px; margin-bottom: 15px;">Adjust calibration constants of current and voltage sensors.</p>
        
        <div class="modal-grid">
            <div class="input-field">
                <label>V_IN_m:</label>
                <input type="number" id="cal_c1" step="0.001" value="1.000">
            </div>
            <div class="input-field">
                <label>V_IN_n:</label>
                <input type="number" id="cal_c2" step="0.001" value="1.000">
            </div>
            <div class="input-field">
                <label>I_IN_m:</label>
                <input type="number" id="cal_c3" step="0.001" value="1.000">
            </div>
            <div class="input-field">
                <label>I_IN_n:</label>
                <input type="number" id="cal_c4" step="0.001" value="1.000">
            </div>
            <div class="input-field">
                <label>V_OUT_m:</label>
                <input type="number" id="cal_c5" step="0.001" value="1.000">
            </div>
            <div class="input-field">
                <label>V_OUT_n:</label>
                <input type="number" id="cal_c6" step="0.001" value="1.000">
            </div>
            <div class="input-field">
                <label>I_OUT_m:</label>
                <input type="number" id="cal_c7" step="0.001" value="1.000">
            </div>
            <div class="input-field">
                <label>I_OUT_n:</label>
                <input type="number" id="cal_c8" step="0.001" value="1.000">
            </div>
        </div>

        <div class="modal-actions" style="margin-top: 20px; display: flex; gap: 10px;">
            <button id="btnGuardarCal" class="btn" style="background-color: #00e676;">Save</button>
            <button id="btnCancelarCal" class="btn" style="background-color: #cfd8dc; color: #333;">Cancel</button>
        </div>
    </div>
</div>

<style>
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content {
        background-color: #1e1e24; border: 1px solid #444; border-radius: 15px;
        padding: 20px; width: 90%; max-width: 500px; color: white; text-align: left;
        box-shadow: 0px 4px 20px rgba(0,0,0,0.5);
    }
    .modal-content h3 { margin-top: 0; color: #ffca28; }
    .modal-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    .input-field { display: flex; flex-direction: column; gap: 4px; }
    .input-field label { font-size: 12px; color: #aaa; }
    .input-field input {
        padding: 8px; background: #2c2c35; border: 1px solid #555;
        border-radius: 8px; color: white; font-size: 14px;
    }
    /* En móviles se pone en 1 sola columna para que no se aplaste */
    @media (max-width: 480px) {
        .modal-grid { grid-template-columns: 1fr; }
    }
</style>
</body>
</html>
