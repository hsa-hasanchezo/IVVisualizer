<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IV Curve Analyzer for FV</title>
    <!-- Stylesheet (local preview) -->
    <link rel="stylesheet" href="../static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">
        <h2>IV Curve for PV Module monitor</h2>
        <div class="controls">
            <button id="botonConectar" class="btn">Connect Bluetooth</button>
                        <button id="botonSolicitarIV" class="btn" disabled>Solicitar IV</button>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <button id="botonLED" class="btn" disabled>Encender LED</button>
                            <span id="ledIndicator" class="led-indicator off" aria-label="Estado LED"></span>
                        </div>
            <div class="readouts" aria-hidden="false" style="margin-top:6px;">
                <div class="readout">
                    <div class="label">Voltaje</div>
                    <div class="value"><span id="voltageValue">-</span> V</div>
                </div>
                <div class="readout">
                    <div class="label">Corriente</div>
                    <div class="value"><span id="currentValue">-</span> A</div>
                </div>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="graficoIV"></canvas>
        </div>
    </div>

    <script src="../static/js/app.js"></script>
    <!-- Removed Flask template tag for static serving -->
</body>
</html>
